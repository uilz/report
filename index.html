<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<!-- SPEC §4.6. 'wasm-unsafe-eval' 是 Argon2id(WebAssembly) 在 Chromium 下运行的最小授权，
     缺少它时 script-src 会阻止 WebAssembly 编译，解锁流程整体不可用。
     报告 HTML 经 iframe[srcdoc] 渲染并继承本 CSP，因此 script/style/font 额外放行
     'unsafe-inline' 与 cdn.jsdelivr.net：报告自带 KaTeX 与内联脚本，需在沙箱内自行渲染。
     沙箱为不透明源（无 allow-same-origin），报告无法触达父文档的 localStorage 与主密钥；
     外壳自身仍只加载 'self' 的本地资源。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>uilz · report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z' fill='%23d9a05b'/%3E%3C/svg%3E">
<!-- 主题引导：与 app.js 的 preferredTheme() 同规则；先于样式表执行，避免错误主题闪烁。 -->
<script>
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("uilz.report.theme"); } catch { /* storage unavailable */ }
    const theme = saved === "light" || saved === "dark" ? saved
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="atmos" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#/" aria-label="返回报告列表">
    <svg class="brand-seal" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 2.6l7.2 3v5.2c0 4.6-3 8.4-7.2 10.6C7.8 19.2 4.8 15.4 4.8 10.8V5.6z" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M9.3 11.7l1.9 2 3.6-4.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-name">uilz<span class="brand-sep">/</span>report</span>
  </a>
  <div class="topbar-actions">
    <button id="theme-btn" class="btn btn-ghost theme-btn" type="button" aria-label="切换到暗色">
      <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 2.8v2.1M12 19.1v2.1M5 5l1.5 1.5M17.5 17.5L19 19M2.8 12h2.1M19.1 12h2.1M5 19l1.5-1.5M17.5 6.5L19 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="lock-btn" class="btn btn-ghost lock-btn" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="5" y="10.5" width="14" height="9.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>锁定</span>
    </button>
  </div>
</header>

<main class="stage">
  <!-- 密码门 -->
  <section id="view-gate" class="view view-gate" hidden>
    <div class="gate-card" id="gate-card">
      <p class="kicker">加密静态保险箱</p>
      <h1 class="gate-title">输入密码解锁</h1>
      <p class="gate-sub">密钥仅在本机派生并保存在内存；报告内容只在隔离沙箱中渲染。密码不会被发送或写入磁盘。</p>
      <form id="gate-form" class="gate-form" novalidate>
        <label class="field-label" for="pw">密码</label>
        <div class="field">
          <input id="pw" class="input" type="password" name="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" enterkeyhint="go" required>
          <button id="pw-toggle" class="field-btn" type="button" aria-label="显示密码">显示</button>
        </div>
        <p id="gate-error" class="alert" role="alert" hidden></p>
        <button id="unlock-btn" class="btn btn-primary btn-block" type="submit">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span id="unlock-label">解锁</span>
        </button>
      </form>
      <p id="kdf-meta" class="kdf-meta"></p>
    </div>
    <p class="gate-foot">无 CDN · 全部脚本与字体来自 ./vendor · 解锁后可离线阅读</p>
  </section>

  <!-- 报告列表 -->
  <section id="view-list" class="view view-list" hidden>
    <div id="list-banner" class="banner" role="status" hidden>
      <svg class="banner-ico ico-banner-info" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 11.2v4.4M12 8.4h.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <svg class="banner-ico ico-banner-error" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3.6L20.8 19H3.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M12 10v4.2M12 17h.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span id="list-banner-text" class="banner-text"></span>
      <button id="list-banner-retry" class="btn btn-ghost banner-btn" type="button" hidden>重试</button>
    </div>
    <div class="list-tools">
      <label class="search" for="q">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M15 15l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="q" class="search-input" type="search" placeholder="搜索标题…" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <p id="list-meta" class="list-meta" aria-live="polite"></p>
    </div>
    <ol id="report-list" class="report-list" aria-label="报告列表"></ol>
    <p id="list-empty" class="empty" hidden>没有匹配的报告</p>
    <div id="list-skeleton" class="skeleton-list" hidden aria-hidden="true">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>
  </section>

  <!-- 报告阅读 -->
  <section id="view-report" class="view view-report" hidden>
    <div class="report-head">
      <a class="btn btn-ghost back-btn" href="#/">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>列表</span>
      </a>
      <div class="report-heading">
        <h1 id="report-title" class="report-title" tabindex="-1">报告</h1>
        <p id="report-meta" class="report-meta"></p>
      </div>
      <button id="report-expand" class="btn btn-ghost zoom-btn" type="button" aria-label="放大（沉浸阅读）">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>放大</span>
      </button>
    </div>
    <div class="report-stage">
      <iframe id="report-frame" class="report-frame" sandbox="allow-scripts allow-popups" referrerpolicy="no-referrer" title="报告内容" hidden></iframe>
      <div id="report-loading" class="report-overlay" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>解密并校验内容…</span>
      </div>
      <div id="report-error" class="report-error" role="alert" hidden>
        <p class="report-error-title">无法打开报告</p>
        <p id="report-error-msg" class="report-error-msg"></p>
        <div class="report-error-actions">
          <button id="report-retry" class="btn btn-ghost" type="button">重试</button>
          <a class="btn btn-ghost" href="#/">返回列表</a>
        </div>
      </div>
      <button id="report-collapse" class="zoom-btn zoom-collapse" type="button" aria-label="缩小（退出沉浸阅读）" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>缩小</span>
      </button>
    </div>
  </section>
</main>

<footer class="foot">
  <span>uilz/report · 端到端加密静态保险箱</span>
  <span class="foot-sep" aria-hidden="true">·</span>
  <span>SPEC v1.1</span>
</footer>

<noscript>
  <p class="noscript">本应用需要 JavaScript 才能在本机解密内容。</p>
</noscript>

<script src="vendor/argon2-bundled.min.js" defer></script>
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/katex/katex.min.js" defer></script>
<script src="vendor/katex/auto-render.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
